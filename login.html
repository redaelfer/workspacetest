<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in to WorkspaceTest</title>
  <style>
    :root {
      color-scheme: light;
      --background: #eef2ff;
      --surface: #ffffff;
      --primary: #4f46e5;
      --primary-dark: #3730a3;
      --text: #111827;
      --muted: #6b7280;
      --border: #d1d5db;
      --shadow: 0 24px 60px rgba(79, 70, 229, 0.18);
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(129, 140, 248, 0.45), transparent 34rem),
        linear-gradient(135deg, #eef2ff 0%, #f8fafc 52%, #fdf2f8 100%);
      display: grid;
      place-items: center;
      padding: 2rem;
    }

    main {
      width: min(100%, 68rem);
      display: grid;
      grid-template-columns: 1fr 26rem;
      gap: 2rem;
      align-items: center;
    }

    .hero {
      padding: 2rem 1rem;
    }

    .eyebrow {
      margin: 0 0 1rem;
      color: var(--primary-dark);
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      max-width: 12ch;
      font-size: clamp(2.75rem, 9vw, 5.75rem);
      line-height: 0.95;
      letter-spacing: -0.06em;
    }

    .hero p:last-child {
      max-width: 34rem;
      margin: 1.4rem 0 0;
      color: var(--muted);
      font-size: clamp(1rem, 2vw, 1.18rem);
      line-height: 1.7;
    }

    .login-card {
      width: 100%;
      padding: 2rem;
      background: rgba(255, 255, 255, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: 1.5rem;
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
    }

    .login-card h2 {
      margin: 0 0 0.45rem;
      font-size: 1.7rem;
      letter-spacing: -0.03em;
    }

    .login-card > p {
      margin: 0 0 1.5rem;
      color: var(--muted);
      line-height: 1.5;
    }

    form {
      display: grid;
      gap: 1rem;
    }

    label {
      display: block;
      margin-bottom: 0.4rem;
      font-size: 0.94rem;
      font-weight: 700;
    }

    input {
      width: 100%;
      min-height: 3rem;
      padding: 0.78rem 0.9rem;
      border: 1px solid var(--border);
      border-radius: 0.8rem;
      color: var(--text);
      font: inherit;
      background: #ffffff;
      transition: border-color 160ms ease, box-shadow 160ms ease;
    }

    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.16);
      outline: none;
    }

    .form-footer {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      margin-top: -0.25rem;
    }

    a {
      color: var(--primary-dark);
      font-weight: 700;
      text-decoration: none;
    }

    a:hover,
    a:focus-visible {
      text-decoration: underline;
    }

    button {
      width: 100%;
      min-height: 3.15rem;
      border: 0;
      border-radius: 0.9rem;
      color: #ffffff;
      font: inherit;
      font-weight: 800;
      background: linear-gradient(135deg, var(--primary), #7c3aed);
      box-shadow: 0 14px 28px rgba(79, 70, 229, 0.28);
      cursor: pointer;
      transition: transform 160ms ease, box-shadow 160ms ease;
    }

    button:hover,
    button:focus-visible {
      transform: translateY(-1px);
      box-shadow: 0 18px 34px rgba(79, 70, 229, 0.34);
      outline: none;
    }

    @media (max-width: 760px) {
      body {
        padding: 1rem;
      }

      main {
        grid-template-columns: 1fr;
        gap: 1rem;
      }

      .hero {
        padding: 1rem 0;
        text-align: center;
      }

      h1,
      .hero p:last-child {
        margin-left: auto;
        margin-right: auto;
      }

      .login-card {
        padding: 1.35rem;
        border-radius: 1.15rem;
      }
    }
  </style>
</head>
<body>
  <main aria-labelledby="page-title">
    <section class="hero" aria-describedby="page-intro">
      <p class="eyebrow">WorkspaceTest</p>
      <h1 id="page-title">Welcome back</h1>
      <p id="page-intro">Sign in to continue to your workspace and keep project updates, guides, and team notes close at hand.</p>
    </section>

    <section class="login-card" aria-labelledby="login-heading">
      <h2 id="login-heading">Sign in</h2>
      <p>Use your account email and password to access the workspace.</p>

      <form action="#" method="post">
        <div>
          <label for="email">Email address</label>
          <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
        </div>

        <div>
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required>
        </div>

        <div class="form-footer">
          <a href="#" aria-label="Forgot your password?">Forgot password?</a>
        </div>

        <button type="submit">Sign in</button>
      </form>
    </section>
  </main>
</body>
</html>
